<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0f0c29" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b0d14" stop-opacity="0"/>
    </radialGradient>

    <!-- Crystal Purple Gradient -->
    <linearGradient id="crystalGrad1" x1="120" y1="80" x2="380" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <!-- Blade Dark Accent Gradient -->
    <linearGradient id="crystalGrad2" x1="180" y1="120" x2="320" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <rect width="512" height="512" rx="110" fill="#0b0d14"/>
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>

  <!-- Outer Rounded Shield Border with Subtle Neon -->
  <rect x="24" y="24" width="464" height="464" rx="96" stroke="url(#crystalGrad1)" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Ambient Shard Glow Behind -->
  <g filter="url(#softGlow)" opacity="0.6">
    <path d="M256 64 L370 200 L320 400 L256 448 L192 400 L142 200 Z" fill="url(#crystalGrad1)"/>
  </g>

  <!-- The Viora Crystal Emblem -->
  <!-- Left Wing / Facet -->
  <path d="M256 70 L148 206 L196 390 L256 442 Z" fill="url(#crystalGrad2)" opacity="0.9"/>
  <!-- Right Wing / Facet -->
  <path d="M256 70 L364 206 L316 390 L256 442 Z" fill="url(#crystalGrad1)"/>

  <!-- Center Diamond Crystal / Sword Spine -->
  <path d="M256 100 L300 220 L256 380 L212 220 Z" fill="#ffffff" opacity="0.18"/>
  <path d="M256 120 L286 220 L256 350 L226 220 Z" fill="#ffffff" opacity="0.3"/>

  <!-- Futuristic "V" Intersection Inset -->
  <path d="M190 190 L256 310 L322 190" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Micro Orbiting Core Cubes (Representing Minecraft Blocks / Packs) -->
  <!-- Top Block -->
  <polygon points="256,44 274,54 256,64 238,54" fill="#38bdf8"/>
  <polygon points="238,54 256,64 256,84 238,74" fill="#0284c7"/>
  <polygon points="274,54 256,64 256,84 274,74" fill="#38bdf8"/>

  <!-- Left Floating Pixel Shard -->
  <polygon points="106,236 120,244 106,252 92,244" fill="#c084fc"/>
  <polygon points="92,244 106,252 106,268 92,260" fill="#9333ea"/>
  <polygon points="120,244 106,252 106,268 120,260" fill="#e879f9"/>

  <!-- Right Floating Pixel Shard -->
  <polygon points="406,236 420,244 406,252 392,244" fill="#38bdf8"/>
  <polygon points="392,244 406,252 406,268 392,260" fill="#0284c7"/>
  <polygon points="420,244 406,252 406,268 420,260" fill="#7dd3fc"/>

  <!-- Center Sparkling Glint -->
  <circle cx="256" cy="310" r="7" fill="#ffffff" filter="url(#glow)"/>
</svg>
